# Host modules (specs/002-host-foundations): JVM tests and the native smoke binary on every target.
name: ci

on:
  push:
    branches: [master, "[0-9][0-9][0-9]-*"]
    paths-ignore: ["spike/**", "**/*.md", ".github/workflows/spike.yml"]
  pull_request:
    paths-ignore: ["spike/**", "**/*.md", ".github/workflows/spike.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Maven Central sometimes answers 429; retry with a pause instead of failing the run.
env:
  MAVEN_ARGS: -Daether.connector.http.retryHandler.count=6 -Daether.connector.http.retryHandler.interval=10000

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
          - target: macos-aarch64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: graalvm/setup-graalvm@v1.6.8
        with:
          java-version: "25"
          distribution: graalvm
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # rg backs api.grep and api.listFiles (D-027); the Java fallback is tested without it.
      - name: Install ripgrep
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ripgrep; else sudo apt-get update -q && sudo apt-get install -y -q ripgrep; fi
          rg --version | head -1

      # Every child process runs in an OS sandbox (D-048): Seatbelt ships with macOS; Linux needs
      # bubblewrap and unprivileged user namespaces, which Ubuntu 24.04 restricts through AppArmor.
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -q bubblewrap
          if ! /usr/bin/bwrap --die-with-parent --unshare-all --ro-bind / / --dev /dev --proc /proc /usr/bin/true; then
            echo "bwrap refused; allowing unprivileged user namespaces"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            /usr/bin/bwrap --die-with-parent --unshare-all --ro-bind / / --dev /dev --proc /proc /usr/bin/true
          fi

      # The hosted Linux image leaves /usr/local (node, npm) writable by everyone. JHarness refuses to
      # run a tool anyone may swap (spec 015, AC-05), which skipped the npm cases, so make it owner-only.
      - name: Make npm owner-writable
        if: runner.os == 'Linux'
        run: |
          sudo chmod -R o-w /usr/local/bin /usr/local/lib/node_modules
          ls -ld /usr/local/bin "$(readlink -f "$(command -v npm)")"

      - name: JVM tests
        run: mvn -B -ntp install

      - name: Native smoke binary
        run: mvn -B -ntp -Pnative -pl jharness-testkit package -DskipTests

      - name: Run native smoke
        run: |
          ls -l jharness-testkit/target/jharness-smoke
          ./jharness-testkit/target/jharness-smoke | tee smoke-${{ matrix.target }}.jsonl

      - name: Native jharness binary
        run: mvn -B -ntp -Pnative -pl jharness-cli package -DskipTests

      # A headless run with a recorded reply: the CLI, session, isolate and api in the native binary.
      - name: Run native jharness
        run: |
          bin=jharness-cli/target/jharness
          ls -l "$bin"
          "$bin" --version
          tmp=$(mktemp -d)
          mkdir -p "$tmp/home" "$tmp/ws"
          echo "hello from the workspace" > "$tmp/ws/a.txt"
          printf '%s\n' '{"reply":"```js\napi.readFile(\"a.txt\")\n```"}' '{"reply":"The file says hello."}' > "$tmp/replay.jsonl"
          "$bin" --home "$tmp/home" --cwd "$tmp/ws" --replay "$tmp/replay.jsonl" -p "read a.txt" | tee "$tmp/out.txt"
          grep -q "The file says hello." "$tmp/out.txt"
          grep -q "\"type\":\"loop.result\".*\"status\":\"ok\"" "$tmp"/home/.jharness/sessions/*/*.jsonl
          # jharness log lists the session and prints it as a timeline (spec 021).
          "$bin" log --home "$tmp/home" --cwd "$tmp/ws" | tee "$tmp/list.txt"
          grep -q "replay/" "$tmp/list.txt"
          "$bin" log --home "$tmp/home" --cwd "$tmp/ws" last | tee "$tmp/timeline.txt"
          grep -q "loop.result  step=1 status=ok" "$tmp/timeline.txt"
          # jharness usage adds up the session's requests (spec 049); replay has no price, so no cost.
          "$bin" usage --home "$tmp/home" --cwd "$tmp/ws" | tee "$tmp/usage.txt"
          grep -Eq "^SESSION +STARTED +MODEL +REQUESTS" "$tmp/usage.txt"
          "$bin" usage --home "$tmp/home" --cwd "$tmp/ws" --json | python3 -c 'import json,sys; j=json.load(sys.stdin); assert j["total"]["requests"] >= 2 and "costUsd" not in j["total"], j'
          # The example custom agent (spec 025): its helpers run and its tools hold in the native binary.
          mkdir -p "$tmp/home/.jharness/agents" && cp -R examples/.jharness/agents/reviewer "$tmp/home/.jharness/agents/"
          printf '%s\n' '{"reply":"```js\ntypeof changedFiles + \" \" + api.readFile(\"a.txt\")\n```"}' '{"reply":"```js\napi.writeFile(\"a.txt\", \"x\")\n```"}' '{"reply":"Reviewed."}' > "$tmp/agent.jsonl"
          "$bin" --home "$tmp/home" --cwd "$tmp/ws" --replay "$tmp/agent.jsonl" --agent reviewer -p "review" | tee "$tmp/agent.txt"
          grep -q "Reviewed." "$tmp/agent.txt"
          "$bin" log --home "$tmp/home" --cwd "$tmp/ws" last --json > "$tmp/agent-log.jsonl"
          grep -q '"customAgent":"reviewer"' "$tmp/agent-log.jsonl"
          grep -q "can't use api.writeFile" "$tmp/agent-log.jsonl"
          grep -q '"status":"ok"' "$tmp/agent-log.jsonl"
          test "$(cat "$tmp/ws/a.txt")" = "hello from the workspace"
          # A subagent (spec 026): api.spawnAgent runs a second loop in its own isolate in the native binary.
          printf '%s\n' '{"reply":"```js\nJSON.parse(api.spawnAgent(\"read a.txt\")).reply\n```"}' '{"reply":"```js\napi.readFile(\"a.txt\")\n```"}' '{"reply":"It says hello."}' '{"reply":"Subagent done."}' > "$tmp/sub.jsonl"
          "$bin" --home "$tmp/home" --cwd "$tmp/ws" --replay "$tmp/sub.jsonl" -p "delegate" | tee "$tmp/sub.txt"
          grep -q "Subagent done." "$tmp/sub.txt"
          "$bin" log --home "$tmp/home" --cwd "$tmp/ws" last --type subagent. > "$tmp/sub-log.txt"
          cat "$tmp/sub-log.txt"
          grep -q "\[sub-1\]  subagent.completed  stopReason=done steps=1" "$tmp/sub-log.txt"
          # api.models() lists the model profiles in the native binary.
          printf '%s\n' '{"reply":"```js\nJSON.parse(api.models()).models.length + \" profiles\"\n```"}' '{"reply":"Listed."}' > "$tmp/models.jsonl"
          "$bin" --home "$tmp/home" --cwd "$tmp/ws" --replay "$tmp/models.jsonl" -p "models" | tee "$tmp/models.txt"
          "$bin" log --home "$tmp/home" --cwd "$tmp/ws" last --json --type api.call > "$tmp/models-log.jsonl"
          grep '"api":"models"' "$tmp/models-log.jsonl" | grep -q '"status":"ok"'
          # A background subagent (spec 027): the main agent waits for it with api.waitAgent.
          printf '%s\n' '{"reply":"```js\nconst a = JSON.parse(api.spawnAgent({task: \"read a.txt\", background: true})).agent;\nJSON.parse(api.waitAgent(a)).reply\n```"}' '{"reply":"```js\napi.readFile(\"a.txt\")\n```"}' '{"reply":"It says hello."}' '{"reply":"Background done."}' > "$tmp/bg.jsonl"
          "$bin" --home "$tmp/home" --cwd "$tmp/ws" --replay "$tmp/bg.jsonl" -p "in the background" | tee "$tmp/bg.txt"
          grep -q "Background done." "$tmp/bg.txt"
          "$bin" log --home "$tmp/home" --cwd "$tmp/ws" last --agent sub-1 --type subagent. > "$tmp/bg-log.txt"
          cat "$tmp/bg-log.txt"
          grep -q "\[sub-1\]  subagent.started  customAgent=default model=session maxSteps=100 background=true" "$tmp/bg-log.txt"
          grep -q "\[sub-1\]  subagent.completed  stopReason=done steps=1" "$tmp/bg-log.txt"
          # Tool definitions (spec 028): the shipped files come from the binary, and api.tools() lists them.
          test -f "$tmp/home/.jharness/tools/maven.json"
          "$bin" tools --home "$tmp/home" --cwd "$tmp/ws" | tee "$tmp/tools.txt"
          grep -Eq "^maven +user +mvn +(ok|not found on PATH) +compile" "$tmp/tools.txt"
          rm "$tmp/home/.jharness/tools/npm.json"
          "$bin" tools reset npm --home "$tmp/home" --cwd "$tmp/ws"
          "$bin" tools check --home "$tmp/home" --cwd "$tmp/ws"
          printf '%s\n' '{"reply":"```js\nJSON.parse(api.tools()).map(t => t.name).join(\",\")\n```"}' '{"reply":"Listed tools."}' > "$tmp/tl.jsonl"
          "$bin" --home "$tmp/home" --cwd "$tmp/ws" --replay "$tmp/tl.jsonl" -p "tools" | tee "$tmp/tl.txt"
          "$bin" log --home "$tmp/home" --cwd "$tmp/ws" last --json --type api.call > "$tmp/tl-log.jsonl"
          grep '"api":"tools"' "$tmp/tl-log.jsonl" | grep -q '"status":"ok"'
          # JS hooks (spec 034): the shipped guard hook blocks a hand edit of a lock file in the native binary.
          mkdir -p "$tmp/home/.jharness/hooks" && cp examples/.jharness/hooks/guard.js "$tmp/home/.jharness/hooks/"
          printf '%s\n' '{"reply":"```js\ntry { api.writeFile(\"package-lock.json\", \"{}\"); \"written\" } catch (e) { e.message }\n```"}' '{"reply":"Hook checked."}' > "$tmp/hk.jsonl"
          "$bin" --home "$tmp/home" --cwd "$tmp/ws" --replay "$tmp/hk.jsonl" -p "hooks" | tee "$tmp/hk.txt"
          "$bin" log --home "$tmp/home" --cwd "$tmp/ws" last --type hook. > "$tmp/hk-log.txt"
          cat "$tmp/hk-log.txt"
          grep -q "hook.ran  hook=guard event=preTool outcome=block" "$tmp/hk-log.txt"
          test ! -e "$tmp/ws/package-lock.json"
          rm "$tmp/home/.jharness/hooks/guard.js"
          # MCP (spec 037): a stdio server in the OS sandbox, listed through api.mcp in the native binary.
          mkdir -p "$tmp/home-mcp/.jharness"
          printf '{"mcp": {"servers": {"fake": {"command": "python3", "args": ["-I", "%s"]}}}}' "$PWD/jharness-agent/src/test/resources/fake_mcp_server.py" > "$tmp/home-mcp/.jharness/settings.json"
          printf '%s\n' '{"reply":"```js\nJSON.parse(api.mcp({list: true}))[0].tools.map(t => t.name).join(\",\")\n```"}' '{"reply":"Listed MCP tools."}' > "$tmp/mcp.jsonl"
          "$bin" --home "$tmp/home-mcp" --cwd "$tmp/ws" --replay "$tmp/mcp.jsonl" -p "mcp" | tee "$tmp/mcp.txt"
          "$bin" log --home "$tmp/home-mcp" --cwd "$tmp/ws" last --type mcp. > "$tmp/mcp-log.txt"
          cat "$tmp/mcp-log.txt"
          grep -q "mcp.connected" "$tmp/mcp-log.txt"
          "$bin" log --home "$tmp/home-mcp" --cwd "$tmp/ws" last --json --type api.call | grep '"api":"mcp"' | grep -q '"status":"ok"'
          # Compaction (spec 039): a reply that reports a nearly full context makes the next call summarize first.
          printf '%s\n' '{"reply":"```js\n\"step done\"\n```","inputTokens":30000,"outputTokens":10}' '{"reply":"The user asked to compact; one step ran."}' '{"reply":"Compacted and done."}' > "$tmp/cmp.jsonl"
          "$bin" --home "$tmp/home" --cwd "$tmp/ws" --replay "$tmp/cmp.jsonl" -p "compact" | tee "$tmp/cmp.txt"
          grep -q "Compacted and done." "$tmp/cmp.txt"
          "$bin" log --home "$tmp/home" --cwd "$tmp/ws" last --type context. | tee "$tmp/cmp-log.txt"
          grep -q "context.compacted  by=auto" "$tmp/cmp-log.txt"
          # @file mentions (spec 040): a mentioned file is attached and recorded; a deny-listed one is not.
          printf 'shop notes\n' > "$tmp/ws/notes.md" && printf 'TOKEN=x\n' > "$tmp/ws/.env"
          printf '%s\n' '{"reply":"Read the notes."}' > "$tmp/at.jsonl"
          "$bin" --home "$tmp/home" --cwd "$tmp/ws" --replay "$tmp/at.jsonl" -p "Summarize @notes.md and @.env" | tee "$tmp/at.txt"
          "$bin" log --home "$tmp/home" --cwd "$tmp/ws" last --json --type prompt.attached | tee "$tmp/at-log.jsonl"
          grep '"path":"notes.md"' "$tmp/at-log.jsonl" | grep -q '"mention":".env"'
          rm "$tmp/ws/notes.md" "$tmp/ws/.env"
          # Resume and fork (spec 043): a headless run continues the last session with its conversation.
          printf '%s\n' '{"reply":"Noted 7."}' > "$tmp/rs1.jsonl" && printf '%s\n' '{"reply":"It was 7."}' > "$tmp/rs2.jsonl"
          "$bin" --home "$tmp/home" --cwd "$tmp/ws" --replay "$tmp/rs1.jsonl" -p "remember 7"
          "$bin" --home "$tmp/home" --cwd "$tmp/ws" --replay "$tmp/rs2.jsonl" --resume -p "what was it?" | tee "$tmp/rs.txt"
          grep -q "It was 7." "$tmp/rs.txt"
          "$bin" log --home "$tmp/home" --cwd "$tmp/ws" last --type session. | tee "$tmp/rs-log.txt"
          grep -q "session.resumed  from=s-.* fork=false turns=1 messages=2" "$tmp/rs-log.txt"
          "$bin" --home "$tmp/home" --cwd "$tmp/ws" --replay "$tmp/rs2.jsonl" --fork -p "branch"
          "$bin" log --home "$tmp/home" --cwd "$tmp/ws" last --type session.resumed | grep -q "fork=true turns=2 messages=4"
          # Headless output (spec 047): one result object with json; every event then the result with stream-json; --mode.
          printf '%s\n' '{"reply":"```js\napi.writeFile(\"out.txt\", \"x\")\n```"}' '{"reply":"Wrote out.txt."}' > "$tmp/hj.jsonl"
          "$bin" --home "$tmp/home" --cwd "$tmp/ws" --replay "$tmp/hj.jsonl" --output json -p "write" > "$tmp/hj.json"
          python3 -I -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["type"]=="result" and r["exitCode"]==0 and r["denied"][0]["api"]=="writeFile", r' "$tmp/hj.json"
          "$bin" --home "$tmp/home" --cwd "$tmp/ws" --replay "$tmp/hj.jsonl" --output stream-json --mode accept-edits -p "write" > "$tmp/hs.jsonl"
          python3 -I -c 'import json,sys; l=[json.loads(x) for x in open(sys.argv[1])]; assert l[0]["type"]=="session.started" and l[-1]["type"]=="result" and l[-1]["filesChanged"]==["out.txt"], l[-1]' "$tmp/hs.jsonl"
          test "$(cat "$tmp/ws/out.txt")" = "x" && rm "$tmp/ws/out.txt"
          # Web viewer (spec 048): jharness view serves the last session on 127.0.0.1 with a token; read-only.
          "$bin" view --home "$tmp/home" --cwd "$tmp/ws" > "$tmp/view.txt" 2>&1 &
          vw=$!
          for i in $(seq 100); do grep -q "^Open http" "$tmp/view.txt" && break; sleep 0.1; done
          url=$(sed -n 's/^Open \(http[^ ]*\).*/\1/p' "$tmp/view.txt")
          base=${url%%/?t=*}; tok=${url##*t=}
          curl -sf --noproxy '*' "$url" | grep -q 'app.js'
          curl -s --noproxy '*' --max-time 3 "$base/events?t=$tok" > "$tmp/view-events.txt" || true
          grep -q '^data: {.*"type":"session.started"' "$tmp/view-events.txt"
          test "$(curl -s --noproxy '*' -o /dev/null -w '%{http_code}' "$base/")" = 403
          test "$(curl -s --noproxy '*' -o /dev/null -w '%{http_code}' -H 'Host: evil.example' "$url")" = 403
          test "$(curl -s --noproxy '*' -o /dev/null -w '%{http_code}' -X POST "$url")" = 405
          kill $vw
          # Action reviewer (spec 038): a fake System One server doubts a write, so bypass mode still refuses it.
          python3 -I jharness-agent/src/test/resources/fake_systemone_server.py "$tmp/so.port" 0.05 &
          so=$!
          for i in $(seq 50); do [ -s "$tmp/so.port" ] && break; sleep 0.1; done
          mkdir -p "$tmp/home-rev/.jharness"
          printf '{"permissions": {"mode": "bypass"}, "reviewer": {"enabled": true, "url": "http://127.0.0.1:%s/v1/systemone"}}' "$(cat "$tmp/so.port")" > "$tmp/home-rev/.jharness/settings.json"
          printf '%s\n' '{"reply":"```js\ntry { api.writeFile(\"reviewed.txt\", \"x\"); \"written\" } catch (e) { e.message }\n```"}' '{"reply":"Tried."}' > "$tmp/rev.jsonl"
          "$bin" --home "$tmp/home-rev" --cwd "$tmp/ws" --replay "$tmp/rev.jsonl" -p "review" | tee "$tmp/rev.txt"
          kill "$so"
          test ! -e "$tmp/ws/reviewed.txt"
          "$bin" log --home "$tmp/home-rev" --cwd "$tmp/ws" last --json --type review. | tee "$tmp/rev-log.txt"
          grep '"type":"review.verdict"' "$tmp/rev-log.txt" | grep -q '"outcome":"deny"'

      # The P3 gate (docs/p3-gate.md): the shipped custom agent and hook work in the native binary.
      - name: P3 gate
        run: scripts/p3-gate.sh jharness-cli/target/jharness

      # The JLine TUI in the native binary through a pseudo-terminal: approval prompt, step, reply, /help, Ctrl-D.
      - name: TUI pseudo-terminal check
        run: python3 -I scripts/tui-pty-check.py jharness-cli/target/jharness

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: smoke-${{ matrix.target }}
          path: |
            smoke-*.jsonl
            jharness-cli/target/jharness
            **/target/surefire-reports/*.txt
          if-no-files-found: ignore
