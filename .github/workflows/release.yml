# Releases (spec 062, D-095): a pushed tag vX.Y.Z that matches the pom's version builds the native binary on every
# target, publishes a GitHub release with SHA256SUMS, build attestations and install.sh, and updates the Homebrew tap.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: check the tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: v
        name: The tag matches the pom, and the release notes exist
        run: echo "version=$(scripts/release-version.sh "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
          - target: macos-aarch64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      # A macOS native image built where LC_CTYPE is C prints ? for non-ASCII text (docs/manual-checks.md).
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: graalvm/setup-graalvm@v1.6.8
        with:
          java-version: "25"
          distribution: graalvm
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Native binary
        run: mvn -B -ntp -Pnative -pl jharness-cli -am package -DskipTests

      - name: Smoke check
        run: |
          bin=jharness-cli/target/jharness
          test "$("$bin" --version)" = "jharness ${{ needs.check.outputs.version }}"
          tmp=$(mktemp -d)
          "$bin" tools check --home "$tmp/home" --cwd "$tmp"
          printf '%s\n' '{"reply":"```js\nJSON.parse(api.readContext()).os\n```"}' '{"reply":"Release smoke done."}' > "$tmp/r.jsonl"
          "$bin" --home "$tmp/home" --cwd "$tmp" --replay "$tmp/r.jsonl" -p "smoke" | grep -q "Release smoke done."
          printf 'caf\xe9\n' > "$tmp/cp.txt"
          printf '%s\n' '{"reply":"```js\nconst c = JSON.parse(api.readBytes(\"cp.txt\", {encoding: \"windows-1252\"})).content; if (c !== \"caf\\u00e9\\n\") throw new Error(c); \"ok\"\n```"}' '{"reply":"Charsets done."}' > "$tmp/c.jsonl"
          "$bin" --home "$tmp/home" --cwd "$tmp" --replay "$tmp/c.jsonl" -p "charsets" | grep -q "Charsets done."
          "$bin" log --home "$tmp/home" --cwd "$tmp" last --json --type loop.result | grep -q '"status":"ok"'

      - name: Package
        run: scripts/package.sh jharness-cli/target/jharness ${{ matrix.target }} dist

      - name: Release scripts
        run: scripts/release-check.sh jharness-cli/target/jharness ${{ matrix.target }}

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: jharness-${{ matrix.target }}
          path: dist/jharness-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: publish the release
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and the install script
        run: |
          cd dist
          sha256sum jharness-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          cp ../scripts/install.sh .

      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            dist/jharness-*.tar.gz
            dist/SHA256SUMS
            dist/install.sh

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "JHarness ${{ needs.check.outputs.version }}" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS

  homebrew:
    name: update the Homebrew tap
    needs: [check, release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.2
        with:
          name: SHA256SUMS

      - name: Commit the formula to canmogol/homebrew-jharness
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN isn't set, so the tap wasn't updated (docs/releasing.md says how to add it)"
            exit 0
          fi
          scripts/homebrew-formula.sh "$VERSION" SHA256SUMS > jharness.rb
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/canmogol/homebrew-jharness.git" tap
          mkdir -p tap/Formula
          cp jharness.rb tap/Formula/jharness.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/jharness.rb
          git diff --cached --quiet && { echo "the formula is unchanged"; exit 0; }
          git commit -q -m "jharness $VERSION"
          git push -q origin HEAD
